name: Release Obsidian plugin

# Runs on every push to main. If manifest.json has a version with no release yet,
# it creates a release (and tag) with main.js, manifest.json and styles.css, which is what BRAT installs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./manifest.json').version")
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists, nothing to do."
            exit 0
          fi
          gh release create "$v" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "$v" \
            --notes "Quests of Tasklandia $v. Install with BRAT: bearbaitdesigns/obsidian_questboard"
